{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Add User</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                value="{{ form.username }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password (at least 8 characters)
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm">
                Confirm password
            </label>

            <input
                type="password"
                id="confirm"
                name="confirm"
                minlength="8"
                required
            >

        </div>


        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
            >

                <option
                    value="user"
                    {% if form.role == 'user' %}selected{% endif %}
                >
                    User
                </option>

                <option
                    value="admin"
                    {% if form.role == 'admin' %}selected{% endif %}
                >
                    Admin
                </option>

            </select>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create User
            </button>

            <a
                href="{{ url_for('users') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
