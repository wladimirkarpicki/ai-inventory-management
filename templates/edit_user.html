{% extends "base.html" %}

{% block title %}
Edit User
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Edit User</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <p>
        <strong>Username:</strong>
        {{ account[1] }}
    </p>

    <form
        method="POST"
        action="{{ url_for('edit_user', user_id=account[0]) }}"
    >

        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
            >

                <option
                    value="user"
                    {% if account[2] == 'user' %}selected{% endif %}
                >
                    User
                </option>

                <option
                    value="admin"
                    {% if account[2] == 'admin' %}selected{% endif %}
                >
                    Admin
                </option>

            </select>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('users') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
