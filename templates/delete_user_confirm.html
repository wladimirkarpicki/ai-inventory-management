{% extends "base.html" %}

{% block title %}
Delete User
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Delete User</h1>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <p>
        Are you sure you want to delete this user account?
    </p>

    <div class="product-details">

        <p>
            <strong>ID:</strong>
            {{ account[0] }}
        </p>

        <p>
            <strong>Username:</strong>
            {{ account[1] }}
        </p>

        <p>
            <strong>Role:</strong>
            {{ account[2] }}
        </p>

    </div>

    <form
        method="POST"
        action="{{ url_for('delete_user', user_id=account[0]) }}"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Delete User
            </button>

            <a
                href="{{ url_for('users') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
