{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Change Password</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <div class="form-group">

            <label for="current_password">
                Current password
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                New password (at least 8 characters)
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm">
                Confirm new password
            </label>

            <input
                type="password"
                id="confirm"
                name="confirm"
                minlength="8"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Change Password
            </button>

            <a
                href="{{ url_for('home') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
