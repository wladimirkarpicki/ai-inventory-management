{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Add Product</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <div class="form-group">

            <label for="brand">
                Brand
            </label>

            <select
                id="brand"
                name="brand_id"
                required
            >

                <option value="">
                    Select a brand
                </option>

                {% for brand in brands %}

                <option
                    value="{{ brand[0] }}"
                    {% if form.brand_id == brand[0] %}selected{% endif %}
                >
                    {{ brand[1] }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="name">
                Product name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ form.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="price">
                Price
            </label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ form.price }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ form.quantity }}"
                min="0"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Product
            </button>

            <a
                href="{{ url_for('products') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
