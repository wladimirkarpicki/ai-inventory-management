{% extends "base.html" %}

{% block title %}
Edit Product
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Edit Product</h1>

    <form
    method="POST"
    action="{{ url_for('edit_product', product_id=product[0]) }}"
>

        <div class="form-group">

            <label for="name">
                Product name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ product[2] }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="price">
                Price
            </label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ product[3] }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ product[4] }}"
                min="0"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('products') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
