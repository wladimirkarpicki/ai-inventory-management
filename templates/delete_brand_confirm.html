{% extends "base.html" %}

{% block title %}
Delete Brand
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Delete Brand</h1>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <p>
        Are you sure you want to delete this brand?
    </p>

    <div class="product-details">

        <p>
            <strong>ID:</strong>
            {{ brand[0] }}
        </p>

        <p>
            <strong>Brand:</strong>
            {{ brand[1] }}
        </p>

    </div>

    <form
        method="POST"
        action="{{ url_for('delete_brand', brand_id=brand[0]) }}"
    >

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Delete Brand
            </button>

            <a
                href="{{ url_for('brands') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
