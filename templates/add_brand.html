{% extends "base.html" %}

{% block title %}
Add Brand
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Add Brand</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('add_brand') }}"
    >

        <div class="form-group">

            <label for="name">
                Brand name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ name | default('') }}"
                maxlength="100"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Brand
            </button>

            <a
                href="{{ url_for('brands') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
