<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Inventory Management System{% endblock %}</title>

    <style>

        .add-product-button {
            display: inline-block;
            margin-bottom: 20px;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #555;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #222;
            color: white;
        }

        .btn-primary:hover {
            background-color: #444;
        }

        .btn-secondary {
            background-color: #ddd;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #ccc;
        }
        .error-message {
            color: #c00;
            background: #fee;
            border: 1px solid #c99;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        .pagination a {
            padding: 8px 14px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .pagination a:hover {
            background-color: #444;
        }

        .pagination span {
            font-weight: bold;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .search-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .search-form input:focus {
            outline: none;
            border-color: #555;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            padding: 25px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            color: #777;
            font-size: 14px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
        }

        nav {
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .nav-user {
            margin-left: auto;
            margin-right: 15px;
            color: #aaa;
            font-size: 14px;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        th a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }

        th a:hover {
            text-decoration: underline;
        }

        tr:hover {
            background-color: #f8f8f8;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/brands">Brands</a>
        {% if current_user_role == 'admin' %}
        <a href="{{ url_for('users') }}">Users</a>
        {% endif %}

        {% if current_user %}
        <span class="nav-user">Logged in as {{ current_user }}</span>
        <a href="{{ url_for('change_password') }}">Change Password</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
