name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      # App code only: tests/scripts are scanned separately (see SECURITY.md
      # rationale) — demo seeds use `random` by design, tests use asserts
      # and fixture passwords.
      - name: Run Bandit (SARIF)
        run: bandit -r main.py database.py -f sarif -o bandit-report.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: bandit-report.sarif
          category: bandit

  pip-audit:
    name: pip-audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      # Non-blocking: report vulnerable deps into the Security tab
      # without failing the pipeline; Dependabot opens upgrade PRs.
      - name: Run pip-audit (SARIF)
        run: pip-audit -f sarif -o pip-audit.sarif
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

  ruff:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check code style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    name: Mypy (Type Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Mypy
        run: mypy main.py database.py
