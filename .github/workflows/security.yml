name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      # App code only: tests/scripts are scanned separately (see SECURITY.md
      # rationale) — demo seeds use `random` by design, tests use asserts
      # and fixture passwords. B608 skipped: all SQL uses parameterized
      # values; f-strings only interpolate compile-time constants (column
      # names, static WHERE clauses), never user input.
      - name: Run Bandit (SARIF)
        run: bandit -r main.py database.py -s B608 -f sarif -o bandit-report.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-report.sarif
          category: bandit

  pip-audit:
    name: pip-audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit the declared dependency tree (requirements.txt) instead of the
      # runner environment — deterministic and CI-friendly.
      # pip-audit has no SARIF format; findings land in the job summary and
      # as a JSON artifact. Dependabot tracks the GitHub Security tab natively.
      - name: Run pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit.json
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json

  ruff:
    name: Ruff (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check code style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    name: Mypy (Type Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Mypy
        run: mypy main.py database.py
